<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidstorm — Neon Arena Defense</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Voidstorm: fly with WASD or the arrow keys, aim with the mouse, click or hold space to fire, shift to dash. Survive the drone waves, chain kills for combo points and catch the drops."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
